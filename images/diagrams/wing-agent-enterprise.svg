ker-end="url(#arrow)"/><path d="M500 401L500 442" stroke="#0C1C4B" stroke-width="5" fill="none" marker-end="url(#arrow)"/><rect x="360" y="454" width="280" height="125" rx="10" fill="#F2F4F8" stroke="none" stroke-width="2"/><text x="500" y="501" font-size="26" font-weight="700" text-anchor="middle" style="fill:#0C1C4B">購買エージェント</text><text x="500" y="547" font-size="21" font-weight="400" text-anchor="middle" style="fill:#0C1C4B">見積比較・発注案</text><path d="M500 583L500 626" stroke="#0C1C4B" stroke-width="5" fill="none" marker-end="url(#arrow)"/><path d="M810 401L810 442" stroke="#0C1C4B" stroke-width="5" fill="none" marker-end="url(#arrow)"/><rect x="670" y="454" width="280" height="125" rx="10" fill="#F2F4F8" stroke="none" stroke-width="2"/><text x="810" y="501" font-size="26" font-weight="700" text-anchor="middle" style="fill:#0C1C4B">契約エージェント</text><text x="810" y="547" font-size="21" font-weight="400" text-anchor="middle" style="fill:#0C1C4B">条項比較・差分確認</text><path d="M810 583L810 626" stroke="#0C1C4B" stroke-width="5" fill="none" marker-end="url(#arrow)"/><path d="M1120 401L1120 442" stroke="#0C1C4B" stroke-width="5" fill="none" marker-end="url(#arrow)"/><rect x="980" y="454" width="280" height="125" rx="10" fill="#F2F4F8" stroke="none" stroke-width="2"/><text x="1120" y="501" font-size="26" font-weight="700" text-anchor="middle" style="fill:#0C1C4B">経理エージェント</text><text x="1120" y="547" font-size="21" font-weight="400" text-anchor="middle" style="fill:#0C1C4B">請求照合・支払案</text><path d="M1120 583L1120 626" stroke="#0C1C4B" stroke-width="5" fill="none" marker-end="url(#arrow)"/><rect x="50" y="638" width="1210" height="120" rx="10" fill="#F8F4E9" stroke="none" stroke-width="2"/><text x="78" y="678" font-size="27" font-weight="700" text-anchor="start" style="fill:#0C1C4B">共通サービス</text><text x="78" y="718" font-size="25" font-weight="400" text-anchor="start" style="fill:#0C1C4B">API・MCP接続  ／  権限を反映した検索  ／  承認済みSkillsの配布</text><path d="M655 762L655 805" stroke="#0C1C4B" s