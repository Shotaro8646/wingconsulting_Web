<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 770" role="img" aria-labelledby="t"><title id="t">1業務を対象とする8週間の導入スケジュール例</title><style>text{font-family:"Meiryo UI",Meiryo,sans-serif;fill:#0C1C4B}</style><rect width="1600" height="770" fill="white"/><defs><marker id="a" viewBox="0 0 12 12" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="16" refX="12" refY="6" orient="auto-start-reverse"><path d="M0 0L12 6L0 12Z" fill="#0C1C4B"/></marker><marker id="g" viewBox="0 0 12 12" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="16" refX="12" refY="6" orient="auto-start-reverse"><path d="M0 0L12 6L0 12Z" fill="#8C6F17"/></marker></defs><text x="50" y="47" font-size="16" font-weight="400" style="fill:#0C1C4B" text-anchor="start">Wing</text><text x="1550" y="47" font-size="16" font-weight="400" style="fill:#0C1C4B" text-anchor="end">IMPLEMENTATION ROADMAP</text><text x="50" y="107" font-size="36" font-weight="700" style="fill:#0C1C4B" text-anchor="start">標準モジュールを使った導入スケジュール例</text><text x="50" y="152" font-size="22" font-weight="400" style="fill:#4A515C" text-anchor="start">全体設計後の1業務・既存システム2〜3接続・顧客担当者の週次参加を想定</text><path d="M50 206H317L342 253L317 300H50Z" fill="#0C1C4B"/><text x="89" y="237" font-size="17" font-weight="700" style="fill:#D9CBA7" text-anchor="start">01</text><text x="89" y="276" font-size="25" font-weight="700" style="fill:white" text-anchor="start">業務・基準の確認</text><text x="68" y="345" font-size="25" font-weight="700" style="fill:#0C1C4B" text-anchor="start">1週目</text><text x="68" y="390" font-size="20" font-weight="400" style="fill:#0C1C4B" text-anchor="start">対象業務・例外の整理</text><text x="68" y="422" font-size="20" font-weight="400" style="fill:#0C1C4B" text-anchor="start">正解例・受入基準を合意</text><text x="68" y="473" font-size="18" font-weight="700" style="fill:#4B3B0C" text-anchor="start">成果物：業務定義・評価基準</text><line x1="68" y1="447" x2="315" y2="447" stroke="#E8E5DE"/><path d="M350 206H617L642 253L617 300H350L374 253Z" fill="#1C345A"/><text x="389" y="237" font-size="17" font-weight="700" style="fill:#D9CBA7" text-anchor="start">02</text><text x="389" y="276" font-size="25" font-weight="700" style="fill:white" text-anchor="start">設定・接続</text><text x="368" y="345" font-size="25" font-weight="700" style="fill:#0C1C4B" text-anchor="start">2〜3週目</text><text x="368" y="390" font-size="20" font-weight="400" style="fill:#0C1C4B" text-anchor="start">Skills・帳票・承認を設定</text><text x="368" y="422" font-size="20" font-weight="400" style="fill:#0C1C4B" text-anchor="start">API接続・データを整備</text><text x="368" y="473" font-size="18" font-weight="700" style="fill:#4B3B0C" text-anchor="start">成果物：検証環境・接続設定</text><line x1="368" y1="447" x2="615" y2="447" stroke="#E8E5DE"/><path d="M650 206H917L942 253L917 300H650L674 253Z" fill="#0C1C4B"/><text x="689" y="237" font-size="17" font-weight="700" style="fill:#D9CBA7" text-anchor="start">03</text><text x="689" y="276" font-size="25" font-weight="700" style="fill:white" text-anchor="start">評価</text><text x="668" y="345" font-size="25" font-weight="700" style="fill:#0C1C4B" text-anchor="start">4〜5週目</text><text x="668" y="390" font-size="20" font-weight="400" style="fill:#0C1C4B" text-anchor="start">過去案件・異常系で検証</text><text x="668" y="422" font-size="20" font-weight="400" style="fill:#0C1C4B" text-anchor="start">品質・権限・復旧を確認</text><text x="668" y="473" font-size="18" font-weight="700" style="fill:#4B3B0C" text-anchor="start">成果物：評価結果・改善版</text><line x1="668" y1="447" x2="915" y2="447" stroke="#E8E5DE"/><path d="M950 206H1217L1242 253L1217 300H950L974 253Z" fill="#1C345A"/><text x="989" y="237" font-size="17" font-weight="700" style="fill:#D9CBA7" text-anchor="start">04</text><text x="989" y="276" font-size="25" font-weight="700" style="fill:white" text-anchor="start">限定運用</text><text x="968" y="345" font-size="25" font-weight="700" style="fill:#0C1C4B" text-anchor="start">6〜7週目</text><text x="968" y="390" font-size="20" font-weight="400" style="fill:#0C1C4B" text-anchor="start">対象者・取引を絞って使用</text><text x="968" y="422" font-size="20" font-weight="400" style="fill:#0C1C4B" text-anchor="start">全件承認で工数・例外を測定</text><text x="968" y="473" font-size="18" font-weight="700" style="fill:#4B3B0C" text-anchor="start">成果物：実績・運用手順</text><line x1="968" y1="447" x2="1215" y2="447" stroke="#E8E5DE"/><path d="M1250 206H1517L1542 253L1517 300H1250L1274 253Z" fill="#0C1C4B"/><text x="1289" y="237" font-size="17" font-weight="700" style="fill:#D9CBA7" text-anchor="start">05</text><text x="1289" y="276" font-size="25" font-weight="700" style="fill:white" text-anchor="start">本番移行</text><text x="1268" y="345" font-size="25" font-weight="700" style="fill:#0C1C4B" text-anchor="start">8週目</text><text x="1268" y="390" font-size="20" font-weight="400" style="fill:#0C1C4B" text-anchor="start">移行判断・教育・引継ぎ</text><text x="1268" y="422" font-size="20" font-weight="400" style="fill:#0C1C4B" text-anchor="start">監視・停止・復旧を確認</text><text x="1268" y="473" font-size="18" font-weight="700" style="fill:#4B3B0C" text-anchor="start">成果物：運用版・責任分担</text><line x1="1268" y1="447" x2="1515" y2="447" stroke="#E8E5DE"/><text x="50" y="549" font-size="21" font-weight="700" style="fill:#0C1C4B" text-anchor="start">週別の配分</text><rect x="250" y="518" width="151" height="42" rx="12" fill="#E4E9F0" stroke="#E4E9F0" stroke-width="1.5"/><text x="326" y="547" font-size="19" font-weight="700" style="fill:#0C1C4B" text-anchor="middle">W1</text><rect x="410" y="518" width="151" height="42" rx="12" fill="#E4E9F0" stroke="#E4E9F0" stroke-width="1.5"/><text x="486" y="547" font-size="19" font-weight="700" style="fill:#0C1C4B" text-anchor="middle">W2</text><rect x="570" y="518" width="151" height="42" rx="12" fill="#E4E9F0" stroke="#E4E9F0" stroke-width="1.5"/><text x="646" y="547" font-size="19" font-weight="700" style="fill:#0C1C4B" text-anchor="middle">W3</text><rect x="730" y="518" width="151" height="42" rx="12" fill="#E4E9F0" stroke="#E4E9F0" stroke-width="1.5"/><text x="806" y="547" font-size="19" font-weight="700" style="fill:#0C1C4B" text-anchor="middle">W4</text><rect x="890" y="518" width="151" height="42" rx="12" fill="#E4E9F0" stroke="#E4E9F0" stroke-width="1.5"/><text x="966" y="547" font-size="19" font-weight="700" style="fill:#0C1C4B" text-anchor="middle">W5</text><rect x="1050" y="518" width="151" height="42" rx="12" fill="#E4E9F0" stroke="#E4E9F0" stroke-width="1.5"/><text x="1126" y="547" font-size="19" font-weight="700" style="fill:#0C1C4B" text-anchor="middle">W6</text><rect x="1210" y="518" width="151" height="42" rx="12" fill="#E4E9F0" stroke="#E4E9F0" stroke-width="1.5"/><text x="1286" y="547" font-size="19" font-weight="700" style="fill:#0C1C4B" text-anchor="middle">W7</text><rect x="1370" y="518" width="151" height="42" rx="12" fill="#E4E9F0" stroke="#E4E9F0" stroke-width="1.5"/><text x="1446" y="547" font-size="19" font-weight="700" style="fill:#0C1C4B" text-anchor="middle">W8</text><rect x="250" y="578" width="151" height="44" rx="12" fill="#0C1C4B" stroke="#0C1C4B" stroke-width="1.5"/><text x="325.5" y="608" font-size="19" font-weight="700" style="fill:white" text-anchor="middle">01 確認</text><rect x="410" y="578" width="311" height="44" rx="12" fill="#0C1C4B" stroke="#0C1C4B" stroke-width="1.5"/><text x="565.5" y="608" font-size="19" font-weight="700" style="fill:white" text-anchor="middle">02 設定・接続</text><rect x="730" y="578" width="311" height="44" rx="12" fill="#0C1C4B" stroke="#0C1C4B" stroke-width="1.5"/><text x="885.5" y="608" font-size="19" font-weight="700" style="fill:white" text-anchor="middle">03 評価</text><rect x="1050" y="578" width="311" height="44" rx="12" fill="#0C1C4B" stroke="#0C1C4B" stroke-width="1.5"/><text x="1205.5" y="608" font-size="19" font-weight="700" style="fill:white" text-anchor="middle">04 限定運用</text><rect x="1370" y="578" width="151" height="44" rx="12" fill="#0C1C4B" stroke="#0C1C4B" stroke-width="1.5"/><text x="1445.5" y="608" font-size="19" font-weight="700" style="fill:white" text-anchor="middle">05 移行</text><rect x="50" y="656" width="1500" height="64" rx="12" fill="#F1EEE7" stroke="#F1EEE7" stroke-width="1.5"/><text x="76" y="683" font-size="22" font-weight="700" style="fill:#4B3B0C" text-anchor="start">次段階への移行は、日付だけでなく受入基準で判断。未達なら範囲を縮小・修正し、再評価する。</text><text x="76" y="709" font-size="19" font-weight="400" style="fill:#4B3B0C" text-anchor="start">API利用許可・データ整備・承認者の確保は着手条件。調達手続や大規模な基幹改修の期間は含めない。</text><text x="50" y="752" font-size="17" font-weight="400" style="fill:#4A515C" text-anchor="start">期間は対象範囲・準備状況に応じて調整する計画例です。</text></svg>