 stroke-width="1.5"/><text x="74" y="666" font-size="24" font-weight="700" style="fill:#0C1C4B" text-anchor="start">文書取り込み処理</text><text x="74" y="696" font-size="19" font-weight="400" style="fill:#0C1C4B" text-anchor="start">抽出・OCR → 分割 → 埋め込み</text><text x="74" y="724" font-size="18" font-weight="400" style="fill:#0C1C4B" text-anchor="start">原本：文書管理／オブジェクト保存</text><path d="M225 630V580" fill="none" stroke="#0C1C4B" stroke-width="5" stroke-linejoin="round" marker-end="url(#a)"/><rect x="510" y="386" width="580" height="190" rx="12" fill="#E4E9F0" stroke="#B8C0CC" stroke-width="1.5"/><text x="534" y="420" font-size="29" font-weight="700" style="fill:#0C1C4B" text-anchor="start">実行制御｜LangGraph</text><text x="534" y="459" font-size="22" font-weight="700" style="fill:#0C1C4B" text-anchor="start">① 計画 → ② コンテキスト取得</text><text x="534" y="494" font-size="22" font-weight="700" style="fill:#0C1C4B" text-anchor="start">③ ツール実行 → ④ 結果検証</text><text x="534" y="545" font-size="20" font-weight="400" style="fill:#0C1C4B" text-anchor="start">状態保存・承認待ち・再開・試行回数制限</text><rect x="1170" y="365" width="380" height="82" rx="12" fill="white" stroke="#B8C0CC" stroke-width="1.5"/><text x="1194" y="398" font-size="26" font-weight="700" style="fill:#0C1C4B" text-anchor="start">LLM｜Claude API 等</text><text x="1194" y="429" font-size="20" font-weight="400" style="fill:#0C1C4B" text-anchor="start">解釈・比較・生成・ツール呼出案</text><path d="M1093 407H1167" fill="none" stroke="#0C1C4B" stroke-width="5" stroke-linejoin="round" marker-end="url(#a)" marker-start="url(#a)"/><text x="1130" y="387" font-size="17" font-weight="400" style="fill:#0C1C4B" text-anchor="middle">推論</text><rect x="1170" y="493" width="380" height="110" rx="12" fill="white" stroke="#B8C0CC" stroke-width="1.5"/><text x="1194" y="526" font-size="23" font-weight="700" style="fill:#0C1C4B" text-anchor="start">状態・メモリ｜PostgreSQL</text><text x="1194" y="556" font-size="20" font-weight="400" style="fill:#0C1C4B" text-anchor="start">checkpoints・承認・実行結果</text><text x="1194" y="584" font-size="19" font-weight="400" style="fill:#0C1C4B" text-anchor="start">業務DBの正本とは論理的に分離</text><path d="M1093 541H1167" fill="none" stroke="#0C1C4B" stroke-width="5" stroke-linejoin="round" marker-end="url(#a)" marker-start="url(#a)"/><path d="M800 579V629" fill="none" stroke="#0C1C4B" stroke-width="5" stroke-linejoin="round" marker-end="url(#a)" marker-start="url(#a)"/><rect x="510" y="632" width="580" height="90" rx="12" fill="#F1EEE7" stroke="#C6B990" stroke-width="1.5"/><text x="534" y="665" font-size="24" font-weight="700" style="fill:#0C1C4B" text-anchor="start">実行前チェック｜Pydantic ＋ 業務コード</text><text x="534" y="696" font-size="20" font-weight="400" style="fill:#0C1C4B" text-anchor="start">スキーマ・権限・承認対象の版・重複実行を検証</text><path d="M800 725V764" fill="none" stroke="#0C1C4B" stroke-width="5" stroke-linejoin="round" marker-end="url(#a)" marker-start="url(#a)"/><rect x="510" y="767" width="580" height="76" rx="12" fill="white" stroke="#B8C0CC" stroke-width="1.5"/><text x="534" y="800" font-size="26" font-weight="700" style="fill:#0C1C4B" text-anchor="start">ツール層｜APIコネクタ ／ MCP</text><text x="534" y="828" font-size="20" font-weight="400" style="fill:#0C1C4B" text-anchor="start">読取・下書き・確定操作を分離／資格情報を管理</text><rect x="1170" y="649" width="380" height="87" rx="12" fill="white" stroke="#B8C0CC" stroke-width="1.5"/><text x="1194" y="681" font-size="25" font-weight="700" style="fill:#0C1C4B" text-anchor="start">観測｜OpenTelemetry</text><text x="1194" y="711" font-size="19" font-weight="400" style="fill:#0C1C4B" text-anchor="start">trace ID・処理時間・費用・エラー</text><path d="M1093 687H1167" fill="none" stroke="#0C1C4B" stroke-width="5" stroke-linejoin="round" marker-end="url(#a)"/><text x="1130" y="668" font-size="17" font-weight="400" style="fill:#0C1C4B" text-anchor="middle">記録</text><rect x="1170" y="774" width="380" height="99" rx="12" fill="#F1EEE7" stroke="#C6B990" stroke-width="1.5"/><text x="1194" y="807" font-size="24" font-weight="700" style="fill