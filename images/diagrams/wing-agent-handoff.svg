<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 550" role="img" aria-labelledby="title"><title id="title">食品メーカーでの部門横断ワークフロー</title><rect width="1600" height="550" fill="white"/><style>text{font-family:"Meiryo UI",Meiryo,sans-serif;fill:#0C1C4B}</style><defs><marker id="arrow" viewBox="0 0 12 12" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" refX="12" refY="6" orient="auto-start-reverse"><path d="M0 0L12 6L0 12Z" fill="#0C1C4B"/></marker></defs><text x="50" y="48" font-size="16" font-weight="400" text-anchor="start" style="fill:#0C1C4B">Wing</text><text x="50" y="111" font-size="36" font-weight="700" text-anchor="start" style="fill:#0C1C4B">購買・契約・経理をつなぐ業務フロー</text><rect x="50" y="188" width="233" height="140" rx="10" fill="#F2F4F8" stroke="none" stroke-width="2"/><text x="166" y="226" font-size="22" font-weight="700" text-anchor="middle" style="fill:#0C1C4B">生産計画</text><text x="166" y="270" font-size="20" font-weight="400" text-anchor="middle" style="fill:#0C1C4B">必要量・納期</text><text x="166" y="307" font-size="17" font-weight="400" text-anchor="middle" style="fill:#0C1C4B">生産管理システム</text><path d="M284 258L300 258" stroke="#0C1C4B" stroke-width="5" fill="none" marker-end="url(#arrow)"/><rect x="303" y="188" width="233" height="140" rx="10" fill="#F2F4F8" stroke="none" stroke-width="2"/><text x="419" y="226" font-size="22" font-weight="700" text-anchor="middle" style="fill:#0C1C4B">購買エージェント</text><text x="419" y="270" font-size="20" font-weight="400" text-anchor="middle" style="fill:#0C1C4B">見積比較・発注案</text><text x="419" y="307" font-size="17" font-weight="400" text-anchor="middle" style="fill:#0C1C4B">購買管理システム</text><path d="M537 258L553 258" stroke="#0C1C4B" stroke-width="5" fill="none" marker-end="url(#arrow)"/><rect x="556" y="188" width="233" height="140" rx="10" fill="#F2F4F8" stroke="none" stroke-width="2"/><text x="672" y="226" font-size="22" font-weight="700" text-anchor="middle" style="fill:#0C1C4B">契約エージェント</text><text x="672" y="270" font-size="20" font-weight="400" text-anchor="middle" style="fill:#0C1C4B">条項・差分確認</text><text x="672" y="307" font-size="17" font-weight="400" text-anchor="middle" style="fill:#0C1C4B">契約・文書管理</text><path d="M790 258L806 258" stroke="#0C1C4B" stroke-width="5" fill="none" marker-end="url(#arrow)"/><rect x="809" y="188" width="233" height="140" rx="10" fill="#F8F4E9" stroke="none" stroke-width="2"/><text x="925" y="226" font-size="22" font-weight="700" text-anchor="middle" style="fill:#0C1C4B">担当者の承認</text><text x="925" y="270" font-size="20" font-weight="400" text-anchor="middle" style="fill:#0C1C4B">契約・発注を確定</text><text x="925" y="307" font-size="17" font-weight="400" text-anchor="middle" style="fill:#0C1C4B">承認ワークフロー</text><path d="M1043 258L1059 258" stroke="#0C1C4B" stroke-width="5" fill="none" marker-end="url(#arrow)"/><rect x="1062" y="188" width="233" height="140" rx="10" fill="#F2F4F8" stroke="none" stroke-width="2"/><text x="1178" y="226" font-size="22" font-weight="700" text-anchor="middle" style="fill:#0C1C4B">発注・入荷</text><text x="1178" y="270" font-size="20" font-weight="400" text-anchor="middle" style="fill:#0C1C4B">送信・受領記録</text><text x="1178" y="307" font-size="17" font-weight="400" text-anchor="middle" style="fill:#0C1C4B">購買・在庫管理</text><path d="M1296 258L1312 258" stroke="#0C1C4B" stroke-width="5" fill="none" marker-end="url(#arrow)"/><rect x="1315" y="188" width="233" height="140" rx="10" fill="#F2F4F8" stroke="none" stroke-width="2"/><text x="1431" y="226" font-size="22" font-weight="700" text-anchor="middle" style="fill:#0C1C4B">経理エージェント</text><text x="1431" y="270" font-size="20" font-weight="400" text-anchor="middle" style="fill:#0C1C4B">請求照合・支払案</text><text x="1431" y="307" font-size="17" font-weight="400" text-anchor="middle" style="fill:#0C1C4B">会計システム</text><rect x="50" y="373" width="1498" height="83" rx="10" fill="#0C1C4B" stroke="none" stroke-width="2"/><text x="799" y="408" font-size="26" font-weight="700" text-anchor="middle" style="fill:white">業務ワークフローが案件ID・引継ぎデータ・完了条件・例外を管理</text><text x="799" y="440" font-size="20" font-weight="400" text-anchor="middle" style="fill:white">承認後に条件が変わった場合は再承認。契約締結が必要な取引は、締結完了を確認してから発注。</text><text x="50" y="505" font-size="21" font-weight="400" text-anchor="start" style="fill:#0C1C4B">支払の確定は別途承認。発注送信や入荷記録は、通常のシステム処理または担当者が実行する。</text></svg>