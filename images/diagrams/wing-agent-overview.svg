<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title description">
<title id="title">AIエージェントの実行フローと継続改善サイクル</title><desc id="description">中央にタスク計画、コンテキスト取得、ツール実行、結果検証の順に実行フローを示す。左のルール、Skills、ナレッジを参照し、右の実行状態DBとメモリに記録する。実行ログと人の修正を評価し、検証済みの更新を知識と手順へ反映する。</desc>
<style>text{font-family:"Meiryo UI",Meiryo,sans-serif;fill:#0C1C4B}.title{font-size:34px;font-weight:700}.h{font-size:28px;font-weight:700}.body{font-size:20px}.sub{font-size:17px;fill:#4A515C}.label{font-size:13px;letter-spacing:1.5px;fill:#4A515C}.green{fill:#1A3CA2}.amber{fill:#4B3B0C}.flow{stroke:#0C1C4B;stroke-width:5;fill:none;stroke-linejoin:round;stroke-linecap:butt}.feedback{stroke:#8C6F17;stroke-width:5;fill:none;stroke-linejoin:round;stroke-linecap:round}.muted-line{stroke:#c9d6d1;stroke-width:1.5;fill:none}.white{fill:#fff}/* Type scale: title 34, agent 28, function 26, group 22, explanation 19. */
text.page-title{font-size:34px;font-weight:700}text.agent-name{font-size:28px;font-weight:700}text.function-name{font-size:26px;font-weight:700}text.group-name{font-size:22px;font-weight:700}text.caption{font-size:19px;font-weight:400}text.connector-label{font-size:17px;font-weight:400}text.meta-text{font-size:15px;font-weight:400}text.step-index{font-size:16px;font-weight:700}
</style><rect width="1600" height="900" fill="#FFFFFF"/><defs>
