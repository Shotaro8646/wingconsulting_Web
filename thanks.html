<style>
:root{--ink:#14181F;--sub:#4A515C;--line:#E8E5DE;--line2:#D6D0C2;--gold:#A98A4B;--gold-deep:#8A6E33}

body{margin:0;background:#fff;color:var(--ink);font-family:'Noto Sans JP','Outfit',sans-serif;

.note{font-size:13px;color:#6B7280;border-top:1px solid var(--line);padding-top:16px;margin-top:22px}
a.back{display:inline-block;margin-top:20px;padding:11px 22px;background:var(--ink);color:#fff;
  text-decoration:none;font-size:13px}
a.line{color:var(--gold-deep);border-bottom:1px solid var(--line2);text-decoration:none}
footer{border-top:1px solid var(--line);padding:18px 22px;font-size:12px;color:#6B7280}
