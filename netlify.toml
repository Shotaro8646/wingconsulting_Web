[build]
  publish = "."

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-XSS-Protection = "1; mode=block"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "geolocation=(), microphone=(), camera=(), payment=()"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains"

# ── 経歴紹介（/profile）──────────────────────────────
# 中身はこのリポジトリに置かない（GitHub で公開されているため）。
# 別の Netlify サイトから取りに行き、URL は wingconsulting.org/profile のまま見せる。
# 名刺やメールで渡したリンクからだけ開く前提なので、検索には載せない。
[[headers]]
  for = "/profile"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"

[[headers]]
  for = "/profile/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"

# /profile と /profile/ は Netlify では同じ扱い。301 で寄せると自分に飛んでループするので、両方とも 200 で取り込む。
[[redirects]]
  from = "/profile"
  to = "https://wingconsulting-profile.netlify.app/"
  status = 200

[[redirects]]
  from = "/profile/*"
  to = "https://wingconsulting-profile.netlify.app/:splat"
  status = 200

# ── 構成確認用の試作（/preview/）──────────────────────────────
# 中身はこのリポジトリに置かない。取引先の名前を出せないため、別の Netlify サイトから取りに行く。
# 仲間に渡したリンクからだけ開く前提なので、検索には載せず、サイトのどこからも張らない。
[[headers]]
  for = "/preview/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow, noarchive"

# /preview/coop と /preview/coop/ は同じ扱い。301 で寄せると自分に飛んでループするので、両方とも 200 で取り込む。
[[redirects]]
  from = "/preview/coop"
  to = "https://wingconsulting-preview.netlify.app/"
  status = 200

[[redirects]]
  from = "/preview/coop/*"
  to = "https://wingconsulting-preview.netlify.app/:splat"
  status = 200

# ── 送信後のページ（/thanks）────────────────────────────────
# 問い合わせフォームの送信先。中身は受付の知らせだけなので検索には載せない。
# 直前にフォームを送信した遷移だけを generate_lead で計測する。
# 直接閲覧・再読込は含めない。有効な問い合わせかどうかは受信内容で別に確かめる。
[[headers]]
  for = "/thanks"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"

[[headers]]
  for = "/thanks.html"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"

# ── StayPath デモ（/staypath/）──────────────────────────────
# 面談の録音にマイクを使うため、この配下だけ microphone を許可する。
# 検索結果には製品ページ（/staypath-guide）を出したいので、アプリ本体は noindex。
[[headers]]
  for = "/staypath/*"
  [headers.values]
    Permissions-Policy = "geolocation=(), camera=(), payment=(), microphone=(self)"
    X-Robots-Tag = "noindex, nofollow"

# SPAのため、/staypath/ 配下のパスは実ファイルが無ければ index.html を返す。
# 実ファイル（assets配下）が優先されるので、この1行で足りる。
[[redirects]]
  from = "/staypath/*"
  to = "/staypath/index.html"
  status = 200

# ── 入口の門は置かない ────────────────────────────────
# 以前は /staypath/ の手前に Basic 認証を掛けていた（staypath-gate）。
# アプリのログインと合わせて鍵が2つになり、どちらの画面で何を入れるのか分からず、
# 合言葉を忘れると入れなくなった。ログインはアプリの1回だけにする。
# データは Supabase の行レベル権限で守られていて、ログインしないと1件も読めない。
# 見えるようになるのはログイン画面だけで、検索には上の noindex で載せない。

# 関税の更新情報をニュースへ移した。以前の記事URLも同じ内容へ案内する。
[[redirects]]
  from = "/blog/japan-tariff-impact"
  to = "/news/japan-tariff-impact"
  status = 301
  force = true

[[redirects]]
  from = "/blog/japan-tariff-impact.html"
  to = "/news/japan-tariff-impact"
  status = 301
  force = true
