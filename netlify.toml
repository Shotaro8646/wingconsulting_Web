[build]
  publish = "."

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-XSS-Protection = "1; mode=block"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "geolocation=(), microphone=(), camera=(), payment=()"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains"

# ── StayPath デモ（/staypath/）──────────────────────────────
# 面談の録音にマイクを使うため、この配下だけ microphone を許可する。
# 検索結果には製品ページ（/staypath-guide）を出したいので、アプリ本体は noindex。
[[headers]]
  for = "/staypath/*"
  [headers.values]
    Permissions-Policy = "geolocation=(), camera=(), payment=(), microphone=(self)"
    X-Robots-Tag = "noindex, nofollow"

# SPAのため、/staypath/ 配下のパスは実ファイルが無ければ index.html を返す。
# 実ファイル（assets配下）が優先されるので、この1行で足りる。
[[redirects]]
  from = "/staypath/*"
  to = "/staypath/index.html"
  status = 200

# ── 入口の門 ────────────────────────────────────
# /staypath/ 配下は合言葉を知っている人にだけ出す。
# 合言葉は Netlify の環境変数（STAYPATH_USER / STAYPATH_PASS）に置く。
# ここは公開リポジトリなので、値そのものは絶対に書かない。
# 受付フォームは門を通らない。関数の側で通す道を決めている。
[[edge_functions]]
  path = "/staypath/*"
  function = "staypath-gate"
